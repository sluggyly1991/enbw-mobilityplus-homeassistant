name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-test.txt
      - run: ruff check custom_components tests fetch_history.py
      - run: ruff format --check custom_components tests fetch_history.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/test_tariff_card.mjs
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q custom_components fetch_history.py
      - run: python scripts/validate_repository.py
