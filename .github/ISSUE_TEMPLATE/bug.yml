name: Bug report
description: Report an integration problem without sharing private data.
body:
  - type: markdown
    attributes:
      value: Do not include passwords, tokens, charging locations, card IDs, config entries or raw HTTP logs.
  - type: input
    id: versions
    attributes:
      label: Home Assistant and integration versions
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics or error category
      description: Integration diagnostics contain counts only. Review any attachment before posting.
