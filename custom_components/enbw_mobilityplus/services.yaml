get_history:
  name: Ladehistorie abrufen
  description: Ruft die jüngsten Ladevorgänge seitenweise ab. Die Antwort enthält sessions und limit_reached.
  fields:
    config_entry_id:
      name: Konto
      selector:
        config_entry:
          integration: enbw_mobilityplus
    limit:
      name: Maximale Anzahl
      default: 1000
      selector:
        number:
          min: 1
          max: 10000
          mode: box

get_stations:
  name: Besuchte Stationen abrufen
  description: Liefert Stationen mit Summen und passenden Live-Ladepunkten der vorhandenen Stationsintegration.
  fields:
    config_entry_id:
      name: Konto
      selector:
        config_entry:
          integration: enbw_mobilityplus

record_tariff_change:
  name: Heutigen Tarifwechsel merken
  description: Speichert den gewählten Tarif und heute als Wechselbeginn nur in HASS. Setzt den nächsten möglichen Wechsel einen Kalendermonat später; in den Optionen korrigierbar. Ändert keinen EnBW-Vertrag.
  fields:
    tariff:
      name: Neuer Tarif
      required: true
      selector:
        select:
          options:
            - S
            - M
            - L
    config_entry_id:
      name: Konto
      selector:
        config_entry:
          integration: enbw_mobilityplus
